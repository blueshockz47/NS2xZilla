name: Build OunceShell Pro
on:
  push:
    branches: [development]
  workflow_dispatch:
concurrency:
  group: ounceshell-pro-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check PASV response format
        run: |
          python3 -c 'from pathlib import Path; s=Path("switch2/third_party/ftpd/ftp.c").read_text(); assert "227, \"Entering Passive Mode (%s)\\r\\n\"" in s'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ounce-devkit-image.tar
          key: ounce-devkit-linux-x64-5e957599bd498643d82e5470aec80da67a12685d-v1
      - name: Fetch Switch 2 SDK
        run: |
          if [ -s "$RUNNER_TEMP/ounce-devkit-image.tar" ] && docker load -i "$RUNNER_TEMP/ounce-devkit-image.tar" && docker image inspect ounce-devkit >/dev/null; then
            exit 0
          fi
          git clone https://github.com/ouncebrew/ounce-devkit.git "$RUNNER_TEMP/ounce-devkit"
          git -C "$RUNNER_TEMP/ounce-devkit" checkout 5e957599bd498643d82e5470aec80da67a12685d
          for attempt in 1 2 3; do
            if docker build -t ounce-devkit "$RUNNER_TEMP/ounce-devkit"; then
              docker save -o "$RUNNER_TEMP/ounce-devkit-image.tar" ounce-devkit
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1
      - name: Compile
        run: |
          docker run --rm -v "$PWD:/src" -w /src ounce-devkit make -f switch2/Makefile -j2
          test -s build/switch2/ounceshell-pro.nro
      - uses: actions/upload-artifact@v4
        with:
          name: OunceShell-Pro-v1.0.0-RC17
          path: build/switch2/ounceshell-pro.nro
          if-no-files-found: error
